name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x86
            zig_target: x86-windows-msvc
            vcpkg_triplet: x86-windows
          - arch: x64
            zig_target: x86_64-windows-msvc
            vcpkg_triplet: x64-windows

    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Create vcpkg cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_cache
            build/vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{
            hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: zig build vcpkg -p build -Dtarget=${{ matrix.zig_target }}

      - name: Build and test
        run: zig build test -p build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }} -Dvcpkg_installed=build/vcpkg_installed/${{ matrix.vcpkg_triplet }}
