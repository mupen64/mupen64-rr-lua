name: Build (nightly)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    strategy:
      matrix:
        arch: [x86, x64]

    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-windows
        with:
          arch: ${{ matrix.arch }}
          is_nightly: true
          commit_hash: ${{ (github.event_name != 'workflow_dispatch') && github.sha || null }}

      - name: CMake Setup
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake --preset vcpkg-win64-${{matrix.arch}} -DCMAKE_BUILD_TYPE=Release

      - name: CMake Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake --build build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mupen-release-nightly-windows-${{ matrix.arch }}
          path: build/out
          retention-days: 14

  linux:
    name: Linux
    # TODO: switch this to ubuntu-latest once this leaves preview.
    runs-on: [ubuntu-26.04]

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ubuntu
        with:
          is_nightly: true
          commit_hash: ${{ (github.event_name != 'workflow_dispatch') && github.sha || null }}

      - name: CMake configure
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake --preset sys-linux -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mupen-release-nightly-linux-x64
          path: build/out
          retention-days: 14
