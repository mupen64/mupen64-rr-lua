name: Auto Format

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-format:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: |
          find ./src -type f \( -name "*.h" -o -name "*.cpp" \) \
            -exec clang-format-18 -i -style=file {} +

      - name: Commit and push reformatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "style: reformat code"
            git push
          }
