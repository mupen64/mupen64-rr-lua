name: Generate release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.2.0)"
        required: true
        type: string

jobs:
  build-stable:
    name: Build stable release artifacts
    uses: ./.github/workflows/build-stable.yml
  
  draft-release:
    name: Setup draft release
    runs-on: ubuntu-latest
    needs: build-stable
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true


      - parallel:
        - name: Download windows-x86 release
          uses: actions/download-artifact@v8
          with:
            name: mupen-release-stable-windows-x86
            skip-decompress: true
        - name: Download windows-x64 release
          uses: actions/download-artifact@v8
          with:
            name: mupen-release-stable-windows-x64
            skip-decompress: true
      
      - name: Rename downloaded artifacts
        shell: bash
        run: |
          mv mupen-release-stable-windows-x86.zip mupen-windows-x86.zip
          mv mupen-release-stable-windows-x64.zip mupen-windows-x64.zip

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"# {version}"
          try:
              start = lines.index(heading) + 1
          except ValueError:
              raise SystemExit(f"No changelog section found for version {version}")
          end = next(
              (i for i in range(start, len(lines)) if lines[i].startswith("# ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"Changelog section for version {version} is empty")
          Path("CHANGELOG_DRAFT.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create draft stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: CHANGELOG_DRAFT.md
          prerelease: false
          draft: true
          files: |
            mupen-windows-x86.zip
            mupen-windows-x64.zip
