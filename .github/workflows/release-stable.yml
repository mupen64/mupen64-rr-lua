name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.2.0)"
        required: true
        type: string

jobs:
  stable-release:
    name: Create Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest commit hash
        id: commit
        run: echo "short_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download mupen-release-stable-x86 artifact from latest run on current branch
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          branch: ${{ github.ref_name }}
          name: mupen-release-stable-x86
          path: ./release-artifact-x86

      - name: Download mupen-release-stable-x64 artifact from latest run on current branch
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          branch: ${{ github.ref_name }}
          name: mupen-release-stable-x64
          path: ./release-artifact-x64

      - name: Zip release artifacts
        run: |
          zip -r mupen64-w32.zip ./release-artifact-x86/
          zip -r mupen64-w64.zip ./release-artifact-x64/
          mv mupen64-w32.zip mupen64-w32
          mv mupen64-w64.zip mupen64-w64

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        id: changelog
        run: |
          git cliff --unreleased --config cliff.toml --output CHANGELOG_DRAFT.md
          {
            echo 'body<<EOF'
            cat CHANGELOG_DRAFT.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create draft stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
          draft: true
          files: |
            mupen64-w32
            mupen64-w64
