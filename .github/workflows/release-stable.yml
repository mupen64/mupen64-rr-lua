name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.2.0)"
        required: true
        type: string

jobs:
  stable-release:
    name: Create Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Ensure this is a branch ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "❌ This workflow must be run from a branch."
            exit 1
          fi

      - name: Download mupen-release-stable artifact from latest run on this branch
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          ref: ${{ github.ref }}
          name: mupen-release-stable
          path: ./release-artifact

      - name: Zip release artifact
        run: |
          zip -r mupen64-rr-lua-${{ inputs.version }}.zip \
            ./release-artifact/

      - name: Get latest stable release tag
        id: stable_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        id: changelog
        run: |
          # Remove all beta tags from the local clone so git-cliff doesn't split
          # the commit range into per-tag version segments (which causes duplicate
          # section headers). This only affects the local repo, not the remote.
          git tag | grep -E '\-beta\-' | xargs -r git tag -d

          git cliff --unreleased --config cliff.toml --output CHANGELOG_DRAFT.md
          {
            echo 'body<<EOF'
            cat CHANGELOG_DRAFT.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create draft stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
          draft: true
          files: mupen64-rr-lua-${{ inputs.version }}.zip
