name: Test (Linux/Qt6)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    # TODO: switch this to ubuntu-latest once this leaves preview.
    runs-on: [ubuntu-26.04] 

    steps:
    - uses: actions/checkout@v6
    - name: Install other dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        qt6-base-dev \
        qt6-declarative-dev \
        nlohmann-json3-dev \
        libavcodec-dev \
        libavformat-dev \
        libavutil-dev \
        libcatch2-dev \
        libdeflate-dev \
        liblua5.4-dev \
        liblz4-dev \
        libsafec-dev \
        libsdl3-dev \
        libspdlog-dev \
        libspeexdsp-dev \
        libswresample-dev \
        libswscale-dev
    - name: CMake configure
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake --preset sys-linux
    - name: CMake build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake --build build
    - name: CMake test
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ctest --test-dir build
        


