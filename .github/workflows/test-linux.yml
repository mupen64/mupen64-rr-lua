name: Test (Linux/Qt6)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    strategy:
      matrix:
        build_type: [debug, release]

    # TODO: switch this to ubuntu-latest once this leaves preview.
    runs-on: [ubuntu-26.04] 

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/setup-ubuntu

    - name: CMake configure
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        cmake_debug="Debug"
        cmake_release="RelWithDebInfo"
        cmake --preset sys-linux-release "-DCMAKE_BUILD_TYPE=$cmake_${{ matrix.build_type }}"

    - name: CMake build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake --build build
      
    - name: CMake test
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ctest --test-dir build
        


