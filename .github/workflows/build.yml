name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

jobs:
  build-debug-nightly:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x86
            zig_target: x86-windows-msvc
            vcpkg_triplet: x86-windows
          - arch: x64
            zig_target: x86_64-windows-msvc
            vcpkg_triplet: x64-windows

    steps:
      - uses: actions/checkout@v6

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set VERSION_SUFFIX and NIGHTLY
        shell: powershell
        run: |
          echo "NIGHTLY=1" >> $env:GITHUB_ENV
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION_SUFFIX=" >> $env:GITHUB_ENV
          } else {
            $hash = "${{ github.sha }}".Substring(0, 7)
            echo "VERSION_SUFFIX=-nightly-$hash" >> $env:GITHUB_ENV
          }

      - name: Create vcpkg cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Cache vcpkg binaries and installed packages
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_cache
            build/vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{
            hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: zig build vcpkg -p build -Dtarget=${{ matrix.zig_target }}

      - name: Build
        run: zig build -p build -Dtarget=${{ matrix.zig_target }} -Dvcpkg_installed=build/vcpkg_installed/${{ matrix.vcpkg_triplet }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mupen-debug-nightly
          path: build/out
          retention-days: 14

  build-release-nightly:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x86
            zig_target: x86-windows-msvc
            vcpkg_triplet: x86-windows
          - arch: x64
            zig_target: x86_64-windows-msvc
            vcpkg_triplet: x64-windows

    steps:
      - uses: actions/checkout@v6

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set VERSION_SUFFIX and NIGHTLY
        shell: powershell
        run: |
          echo "NIGHTLY=1" >> $env:GITHUB_ENV
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION_SUFFIX=" >> $env:GITHUB_ENV
          } else {
            $hash = "${{ github.sha }}".Substring(0, 7)
            echo "VERSION_SUFFIX=-nightly-$hash" >> $env:GITHUB_ENV
          }

      - name: Create vcpkg cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Cache vcpkg binaries and installed packages
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_cache
            build/vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{
            hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: zig build vcpkg -p build -Dtarget=${{ matrix.zig_target }}

      - name: Build
        run: zig build -p build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }} -Dvcpkg_installed=build/vcpkg_installed/${{ matrix.vcpkg_triplet }}

      - name: Delete PDB files
        shell: powershell
        run: |
          Get-ChildItem -Path build/out -Filter *.pdb -Recurse -File |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mupen-release-nightly
          path: build/out
          retention-days: 14

  build-release-stable:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x86
            zig_target: x86-windows-msvc
            vcpkg_triplet: x86-windows
          - arch: x64
            zig_target: x86_64-windows-msvc
            vcpkg_triplet: x64-windows

    steps:
      - uses: actions/checkout@v6

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Create vcpkg cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Cache vcpkg binaries and installed packages
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_cache
            build/vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{
            hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: zig build vcpkg -p build -Dtarget=${{ matrix.zig_target }}

      - name: Build
        run: zig build -p build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }} -Dvcpkg_installed=build/vcpkg_installed/${{ matrix.vcpkg_triplet }}

      - name: Delete PDB files
        shell: powershell
        run: |
          Get-ChildItem -Path build/out -Filter *.pdb -Recurse -File |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mupen-release-stable
          path: build/out
          retention-days: 14
