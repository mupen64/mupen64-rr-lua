name: Check Format

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: DoozyX/clang-format-lint-action@v0.18.2
        with:
          source: "./src"
          exclude: "./lib ./tools"
          extensions: "h,cpp"
          clangFormatVersion: 22.1.3
          style: file
