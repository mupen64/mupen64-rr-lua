name: "Ubuntu environment setup"
description: "Sets up the mupen64-rr dev environment on Ubuntu"

inputs:
  is_nightly:
    description: "Whether to setup the nightly build variables."
    required: false
    default: false
  commit_hash:
    description: "Truncated commit hash to append to the nightly version suffix."
    required: false
    default: null

runs:
  using: composite
  steps:
    - name: Update apt-get index
      shell: sh
      run: sudo apt-get update

    - name: Install development tools
      shell: sh
      run: sudo apt-get install ninja-build

    - name: Install dependencies
      shell: sh
      run: |
        sudo apt-get install -y \
        qt6-base-dev \
        qt6-declarative-dev \
        nlohmann-json3-dev \
        libavcodec-dev \
        libavformat-dev \
        libavutil-dev \
        libcatch2-dev \
        libdeflate-dev \
        liblua5.4-dev \
        liblz4-dev \
        libsafec-dev \
        libsdl3-dev \
        libspdlog-dev \
        libspeexdsp-dev \
        libswresample-dev \
        libswscale-dev

    - name: Setup nightly build environment variables
      if: ${{ inputs.is_nightly }}
      shell: bash
      run: |
        echo "NIGHTLY=1" >> $env:GITHUB_ENV
        echo "VERSION_SUFFIX=${{ inputs.commit_hash && format('-nightly-{0}', inputs.commit_hash) || '' }}" >> $env:GITHUB_ENV